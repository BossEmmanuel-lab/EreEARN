[package]
name = "ereearn-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ereearn_escrow"
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "21.7.1"

[dev-dependencies]
soroban-sdk = { version = "21.7.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
